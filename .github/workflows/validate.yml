name: Validate bot

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check interaction handler
        run: node --check api/discord.js
      - name: Check command registration
        run: node --check scripts/register-commands.js
      - name: Check server setup
        run: node --check src/setup.js
      - name: Check Discord gateway
        run: node --check src/gateway.js
